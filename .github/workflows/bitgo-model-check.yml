name: Bitgo Model Connectivity Check

on:
  schedule:
    # GitHub Actions cron uses UTC. 01:17 UTC is 09:17 Asia/Shanghai.
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bitgo-model-check
  cancel-in-progress: false

jobs:
  check-models:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REASONING_API_ENDPOINT: https://api-bitgo.enigmhaven.com/v1/messages
      REASONING_WALLET_CHAIN: ${{ secrets.REASONING_WALLET_CHAIN }}
      REASONING_WALLET_ADDRESS: ${{ secrets.REASONING_WALLET_ADDRESS }}
      REASONING_MONEY: ${{ secrets.REASONING_MONEY }}
      REASONING_MONEY_ID: ${{ secrets.REASONING_MONEY_ID }}
      REASONING_PRIVATE_KEY: ${{ secrets.REASONING_PRIVATE_KEY }}
      REASONING_SIGNER_COMMAND: ${{ secrets.REASONING_SIGNER_COMMAND }}
      REASONING_INTERFACE_PRIVATE_KEY_PEM: ${{ secrets.REASONING_INTERFACE_PRIVATE_KEY_PEM }}
      GMAIL_CREDENTIALS_JSON: ${{ secrets.GMAIL_CREDENTIALS_JSON }}
      GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      REPORT_RECIPIENTS: ${{ secrets.REPORT_RECIPIENTS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Install the tool
        run: python -m pip install .
      - name: Check all Bitgo models and deliver report
        run: python -m github_ai_daily model-check --output-dir reports --send-email
      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitgo-model-check-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30
